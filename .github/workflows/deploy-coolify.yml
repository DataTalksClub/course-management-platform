name: Deploy CMP Coolify (Contabo)

# Course CD: GHA builds → GHCR → private cmp-staging release service.
# The shared machine-management follower promotes its healthy image to the
# native public rolling Application; cmp-staging must keep Traefik disabled.
# DEV has a separate cmp-dev service and database; see deploy/coolify/README.md.
# The coolify-staging GitHub environment is the production release authority.
# No git SSH / deploy keys / git clone on Contabo.
# Mirrors DataTalksClub/relay .github/workflows/deploy-coolify.yml (pilot).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "deploy/coolify/**"
      - ".github/workflows/deploy-dev.yaml"
      - ".github/workflows/deploy-prod.yaml"
      - ".github/workflows/e2e-smoke-dev.yaml"

concurrency:
  group: cmp-coolify
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: datatalksclub/course-management-platform

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cmp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/cmp_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Django checks
        run: |
          uv run python manage.py shell -c "from django.db import connection; connection.ensure_connection(); print('CI database:', connection.vendor, connection.pg_version); assert connection.vendor == 'postgresql'"
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py check
      - name: Tests
        run: uv run pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.identity.outputs.version }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Construct release identity (exact ECR tag format)
        id: identity
        run: |
          set -euo pipefail
          # Same construction as website .github/workflows/deploy-dev.yml:
          #   version="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          # CMP/AISHL deploy-dev: DATE=$(date +'%Y%m%d-%H%M%S'); SHORT_SHA=…; TAG=${DATE}-${SHORT_SHA}
          # Live ECR example (CMP): 20261021-094333-f922dc4
          version="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Exact ECR production tag only (YYYYMMDD-HHMMSS-<7>). Never :latest. Never sha-<…>.
          tags: |
            type=raw,value=${{ steps.identity.outputs.version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the release identity into the image so /api/health/
          # reports the deployed tag even without a runtime VERSION override.
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    # Environment name retained for existing secrets; targets production courses.
    environment: coolify-staging
    steps:
      - name: Pin Coolify image to ECR tag YYYYMMDD-HHMMSS-<7> and deploy
        id: coolify-deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_CMP_SERVICE_UUID }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_URL:-}" || -z "${COOLIFY_TOKEN:-}" || -z "${COOLIFY_SERVICE_UUID:-}" ]]; then
            echo "Missing Coolify secrets: COOLIFY_URL, COOLIFY_TOKEN, COOLIFY_CMP_SERVICE_UUID" >&2
            exit 1
          fi
          # Exact ECR tag (YYYYMMDD-HHMMSS-<7>): pin Coolify compose image AND
          # VERSION env to the same tag, never :latest.
          # /api/health/ reports settings.VERSION, so a stale VERSION env
          # makes prod report the previous release after a deploy (intake
          # 91dbd820: prod still reported 20261025-092420-c0db50c after the
          # 0c8eaab deploy). The native public rolling Application mirrors
          # this env via the follower, so the source must carry the new tag.
          # Coolify compose services store the image in docker_compose_raw (base64 on write).
          # NOTE: GHA runners often cannot reach COOLIFY_URL (:8000 timeout), but the
          # image was already pushed to GHCR by the build-and-push job. Network-level
          # failures (timeout / connection refused / reset) are therefore SOFT-FAIL
          # (exit 0): the Hetzner poller (deploy/coolify/hetzner-rollout.sh, cron */5
          # on RMTHZ) converges running == newest GHCR tag automatically.
          # Real errors when Coolify IS reachable (HTTP 4xx/5xx, compose pin mismatch)
          # still fail the job.
          set +e
          python3 - <<'PY'
          import base64, json, os, re, socket, sys, urllib.error, urllib.request

          base = os.environ["COOLIFY_URL"].rstrip("/")
          token = os.environ["COOLIFY_TOKEN"]
          uuid = os.environ["COOLIFY_SERVICE_UUID"]
          image_ref = os.environ["IMAGE_REF"]
          image_tag = os.environ["IMAGE_TAG"]
          prefix = f"{image_ref}:"
          TIMEOUT = 30

          def call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{base}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                  body = resp.read()
                  return resp.status, (json.loads(body) if body else {})

          def main():
              _st, svc = call("GET", f"/api/v1/services/{uuid}")
              raw = svc["docker_compose_raw"]
              # Pin every service running our image (web + scoring worker).
              new, n = re.subn(
                  re.escape(prefix) + r"[^\s'\"]+",
                  prefix + image_tag,
                  raw,
              )
              if n < 1:
                  raise SystemExit(f"Could not pin image {prefix}* in Coolify compose (matches={n})")
              # Keep VERSION in lockstep with the image tag: the health
              # endpoint (and the public rolling follower) read this env.
              new, m = re.subn(
                  r"(?m)^(\s*VERSION\s*:\s*)([^\s'\"]+|'[^']*'|\"[^\"]*\")\s*$",
                  r"\g<1>" + image_tag,
                  new,
                  count=1,
              )
              if m != 1:
                  raise SystemExit(f"Could not pin VERSION in Coolify compose (matches={m})")
              call(
                  "PATCH",
                  f"/api/v1/services/{uuid}",
                  {"docker_compose_raw": base64.b64encode(new.encode()).decode()},
              )
              _st, out = call("POST", f"/api/v1/deploy?uuid={uuid}&force=true")
              print(json.dumps(out))
              print(f"Pinned {prefix}{image_tag} with VERSION={image_tag} and triggered Coolify deploy for {uuid}")

          try:
              main()
          except urllib.error.HTTPError as e:
              # Coolify reachable but returned an error: real failure, keep red.
              try:
                  detail = e.read().decode()[:500]
              except Exception:
                  detail = "<unreadable body>"
              print(f"::error::Coolify API HTTP {e.code} on {e.url}: {detail}", flush=True)
              sys.exit(1)
          except (urllib.error.URLError, TimeoutError, socket.timeout, ConnectionError, OSError) as e:
              # Coolify unreachable (:8000 timeout / DNS / connection reset).
              # GHCR image already pushed; Hetzner poller converges automatically.
              # Exit 47 (not 0) so the wrapper below can record reachable=false
              # and skip post-deploy verification instead of failing it.
              print(
                  f"::warning::Coolify API unreachable ({type(e).__name__}: {e}). "
                  f"Image {prefix}{image_tag} already pushed to GHCR; "
                  "Hetzner poller (deploy/coolify/hetzner-rollout.sh, cron */5 on RMTHZ) "
                  "will converge Contabo to this tag. Treating as soft-fail (exit 47).",
                  flush=True,
              )
              sys.exit(47)
          PY
          rc=$?
          set -e
          if [[ $rc -eq 47 ]]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $rc -ne 0 ]]; then
            exit $rc
          fi
          echo "reachable=true" >> "$GITHUB_OUTPUT"

      - name: Verify private release service runs pinned image (t658u)
        # Catches the 2026-10-22 failure mode where Coolify created the new
        # container but never started it. Public web now stays on the previous
        # healthy image; the shared follower promotes only a healthy source.
        # Skipped when the deploy step soft-failed (API unreachable from GHA);
        # the Hetzner poller owns convergence in that case.
        if: steps.coolify-deploy.outputs.reachable == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_CMP_SERVICE_UUID }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          base = os.environ["COOLIFY_URL"].rstrip("/")
          token = os.environ["COOLIFY_TOKEN"]
          uuid = os.environ["COOLIFY_SERVICE_UUID"]
          want = f"{os.environ['IMAGE_REF']}:{os.environ['IMAGE_TAG']}"
          deadline = time.time() + 300  # 5 min for pull + migrate + gunicorn boot

          def fetch():
              req = urllib.request.Request(
                  f"{base}/api/v1/services/{uuid}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read())

          last = ""
          while time.time() < deadline:
              try:
                  svc = fetch()
                  apps = svc.get("applications") or [{}]
                  web_apps = [a for a in apps if a.get("name") == "web"] or apps[:1]
                  app = web_apps[0]
                  last = f"image={app.get('image')} status={app.get('status')}"
                  print(f"verify: {last}", flush=True)
                  if app.get("image") == want and str(app.get("status", "")).startswith("running"):
                      print(f"verify OK: {want} is {app.get('status')}")
                      sys.exit(0)
              except urllib.error.HTTPError as e:
                  print(f"::error::Coolify API HTTP {e.code} during verify", flush=True)
                  sys.exit(1)
              except Exception as e:  # transient network blip: keep polling until deadline
                  last = f"{type(e).__name__}: {e}"
                  print(f"verify: transient error, retrying: {last}", flush=True)
              time.sleep(15)

          print(f"::error::Timed out waiting for {want} to run (last: {last})", flush=True)
          sys.exit(1)
          PY

      - name: "Guard: verify dev health endpoint is healthy (cfaf0378)"
        # Fails loudly if dev CMP returns 503 or unhealthy after deploy.
        run: |
          set -euo pipefail
          echo "Verifying dev health endpoint (https://dev.courses.datatalks.club/api/health/)..."
          healthy=false
          resp=""
          for i in $(seq 1 12); do
            resp=$(curl -fsS --max-time 10 https://dev.courses.datatalks.club/api/health/ || true)
            echo "Attempt $i: $resp"
            if echo "$resp" | grep -q '"status": *"ok"'; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [[ "$healthy" != "true" ]]; then
            echo "::error::https://dev.courses.datatalks.club/api/health/ failed health check: $resp"
            exit 1
          fi
          echo "Dev health check OK."
