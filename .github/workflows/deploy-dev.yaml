name: Deploy Dev (AWS ECS — retired)

# RETIRED (2026-10-22): the AWS ECS dev path is obsolete and intentionally NOT
# triggered by pushes. The course-management-dev ELB target group was deleted
# (ELB cut / Contabo Coolify migration), so every main push failed at
# `aws ecs update-service` with:
#   InvalidParameterException: target group
#   arn:aws:elasticloadbalancing:eu-west-1:387546586013:targetgroup/course-management-dev/e7fbcd61f2279f3a
#   does not exist.
# (GHA runs 39807898139, 39806180567 — tests passed, only the AWS deploy failed.)
# Live staging CD is "Deploy CMP Coolify (Contabo)"
# (.github/workflows/deploy-coolify.yml): GHA builds linux/amd64 → GHCR →
# Coolify deploys on Contabo. Do NOT re-add a `push` trigger here and do NOT
# recreate the AWS ALB/TG unless AWS ECS staging is explicitly required for
# live traffic again. Kept as workflow_dispatch-only for manual AWS
# repair/verification.

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.5'

    - name: Install dependencies
      run: |
        pip install uv
        uv sync --locked

    - name: Run tests
      run: make tests

    - name: Run typecheck
      run: make typecheck

  deploy:
    runs-on: ubuntu-24.04
    needs: test
    if: github.ref == 'refs/heads/main'

    env:
      AWS_REGION: eu-west-1
      REPO_ROOT: 387546586013.dkr.ecr.eu-west-1.amazonaws.com
      REPO_URI: 387546586013.dkr.ecr.eu-west-1.amazonaws.com/course-management

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Prepare tags and repository info
      id: prep
      run: |
        DATE=$(date +'%Y%m%d-%H%M%S')
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-7)
        echo "TAG=${DATE}-${SHORT_SHA}" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.5'

    - name: Build Docker image
      run: docker build -t course_management:${{ env.TAG }} .

    - name: Log in to Amazon ECR
      run: |
        aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.REPO_ROOT }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Push Docker image to Amazon ECR
      run: |
        docker tag course_management:${{ env.TAG }} ${{ env.REPO_URI }}:${{ env.TAG }}
        docker push ${{ env.REPO_URI }}:${{ env.TAG }}

    - name: Deploy to Dev Environment
      run: bash deploy/deploy_dev.sh ${{ env.TAG }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
