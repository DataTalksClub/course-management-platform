name: E2E Smoke (Dev)

# Standalone Playwright e2e smoke suite. ON HOLD since 2026-11-04: the daily
# schedule and the dev default target are removed until an isolated dev
# service and database have been verified, because e2e/safety.py deliberately
# hard-refuses every remote target (including current dev). Dispatch is kept
# for on-demand runs against a loopback server. See e2e/README.md
# ("Scheduling") and issue #194.
on:
  # Manual run (the primary way to run this job once a safe target exists).
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Expected /api/health/ version (optional)"
        required: false

jobs:
  smoke:
    runs-on: ubuntu-24.04

    # Email verification no longer uses a mock/real inbox. The suite reads CMP's
    # own DatamailerSendAudit rows over HTTP (GET /api/datamailer/send-audits):
    # the real prod send path runs (outbox -> dispatch -> /api/transactional/send
    # -> audit), but with Datamailer's dry_run flag the render is returned inline
    # and nothing is delivered. For this to be SAFE, the dev DEPLOYMENT itself
    # must run with RELAY_TRANSACTIONAL_DRY_RUN=1 (set on the isolated cmp-dev
    # Coolify service; see deploy/coolify/docker-compose.dev.yml). Without it,
    # dev would send real email during the smoke run; the email tests xfail
    # if no audit appears.
    env:
      # Loopback is the only allowed target class (e2e/safety.py hard-refuses
      # everything else). Until the local-server harness or the isolated dev
      # target is verified (e2e/README.md), a dispatch without a booted local
      # server fails fast at the health step.
      E2E_BASE_URL: 'http://127.0.0.1:8000'
      E2E_API_TOKEN: ${{ secrets.E2E_DEV_API_TOKEN }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_DEV_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_DEV_ADMIN_PASSWORD }}
      E2E_EXPECTED_VERSION: ${{ github.event.inputs.expected_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --locked

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Wait for target health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${E2E_BASE_URL}/api/health/" | grep -q '"status": *"ok"'; then
              echo "Dev is healthy."; exit 0
            fi
            echo "Waiting for dev health... ($i)"; sleep 10
          done
          echo "Dev health never became OK"; exit 1

      - name: Run e2e smoke suite
        working-directory: e2e
        run: uv run --project .. pytest -c pytest.ini

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
